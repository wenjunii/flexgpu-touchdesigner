version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /integrations/moge2
      - /integrations/depth_anything
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      routine-python:
        applies-to: version-updates
        patterns: ['*']
      security-python:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      routine-actions:
        applies-to: version-updates
        patterns: ['*']
      security-actions:
        applies-to: security-updates
        patterns: ['*']
